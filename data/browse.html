<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Gözat — Arama</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --text: #1f1f22;
      --muted: #777780;
      --line: #ececef;
      --brand: #1c1c1e;
      --brand-hover: #2a2a2d;
      --radius: 12px;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      padding: 32px 18px 48px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .top {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 2.5vw, 24px);
      letter-spacing: -0.02em;
    }

    .back {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }

    .back:hover {
      color: var(--text);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }

    label.sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    select,
    input[type="search"] {
      font: inherit;
      font-size: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
      background: var(--surface);
      color: var(--text);
      min-width: 0;
    }

    select {
      max-width: 100%;
      flex: 1 1 200px;
    }

    input[type="search"] {
      flex: 2 1 240px;
    }

    input[type="search"]:disabled {
      opacity: 0.5;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
      width: 100%;
    }

    .status.error {
      color: #b42318;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      gap: 14px;
      align-items: start;
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 4px 14px rgba(15, 15, 20, 0.04);
      overflow: hidden;
      min-height: 320px;
      max-height: min(70vh, 640px);
      display: flex;
      flex-direction: column;
    }

    .card-head {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .list {
      margin: 0;
      padding: 0;
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }

    .list button {
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      padding: 11px 14px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      color: var(--text);
      transition: background 0.12s ease;
    }

    .list button:hover {
      background: #f4f5f6;
    }

    .list button[aria-current="true"] {
      background: #eef2ff;
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .list button .sub {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      word-break: break-all;
    }

    .empty {
      padding: 24px 14px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    .detail {
      max-height: min(70vh, 640px);
      overflow-y: auto;
      padding: 14px 16px 18px;
    }

    .detail h2 {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
    }

    .detail .meta {
      margin: 0 0 14px;
      font-size: 12px;
    }

    .detail .meta a {
      color: var(--accent);
      word-break: break-all;
    }

    .attr-form fieldset {
      border: 1px solid var(--line);
      border-radius: 10px;
      margin: 0 0 12px;
      padding: 10px 12px 12px;
    }

    .attr-form legend {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 0 6px;
    }

    .field {
      margin-bottom: 10px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .field input,
    .field textarea {
      width: 100%;
      font: inherit;
      font-size: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: #fafafa;
      color: var(--text);
    }

    .field textarea {
      min-height: 72px;
      resize: vertical;
    }

    .placeholder {
      font-size: 13px;
      color: var(--muted);
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <h1>Dataset arama</h1>
      <a class="back" href="./index.html">← İndirme listesi</a>
    </div>

    <div class="toolbar">
      <label class="sr" for="dataset">Kategori</label>
      <select id="dataset" aria-label="Kategori seçin">
        <option value="">Kategori seçin…</option>
      </select>
      <label class="sr" for="q">Ara</label>
      <input type="search" id="q" placeholder="Başlık veya özelliklerde ara…" disabled autocomplete="off" />
      <div class="status" id="status" aria-live="polite"></div>
    </div>

    <div class="layout">
      <section class="card" aria-label="Sonuç listesi">
        <div class="card-head" id="listHead">Sonuçlar</div>
        <ul class="list" id="list"></ul>
      </section>
      <section class="card" aria-label="Kayıt detayı">
        <div class="card-head">Özellikler</div>
        <div class="detail" id="detail">
          <p class="placeholder">Bir kayıt seçin.</p>
        </div>
      </section>
    </div>
  </div>

  <script>
    (function () {
      const elDataset = document.getElementById("dataset");
      const elQ = document.getElementById("q");
      const elStatus = document.getElementById("status");
      const elList = document.getElementById("list");
      const elListHead = document.getElementById("listHead");
      const elDetail = document.getElementById("detail");

      let rawItems = [];
      let filtered = [];
      let selectedIndex = -1;
      let bundles = [];

      function labelForFile(name) {
        return name
          .replace(/\.json$/i, "")
          .replace(/[-_]/g, " ")
          .replace(/\b\w/g, (c) => c.toUpperCase());
      }

      function encodePathSegment(name) {
        return name.split("/").map(encodeURIComponent).join("/");
      }

      function walkValues(obj, acc) {
        if (obj == null) return;
        if (typeof obj === "string" || typeof obj === "number" || typeof obj === "boolean") {
          acc.push(String(obj));
          return;
        }
        if (Array.isArray(obj)) {
          obj.forEach((v) => walkValues(v, acc));
          return;
        }
        if (typeof obj === "object") {
          Object.values(obj).forEach((v) => walkValues(v, acc));
        }
      }

      function searchBlob(item) {
        const parts = [item.h1, item.title, item.url, item.canonicalUrl].filter(Boolean).map(String);
        if (item.attributes) walkValues(item.attributes, parts);
        return parts.join(" \n ").toLowerCase();
      }

      function formatValue(val) {
        if (val == null) return "";
        if (Array.isArray(val)) {
          return val.map((v) => (typeof v === "object" ? JSON.stringify(v) : String(v))).join(", ");
        }
        if (typeof val === "object") return JSON.stringify(val, null, 2);
        return String(val);
      }

      function tokenize(q) {
        return q
          .toLowerCase()
          .trim()
          .split(/\s+/)
          .filter(Boolean);
      }

      function applyFilter() {
        const tokens = tokenize(elQ.value);
        if (!tokens.length) {
          filtered = rawItems.slice();
        } else {
          filtered = rawItems.filter((item) => {
            const hay = item._search;
            return tokens.every((t) => hay.includes(t));
          });
        }
        selectedIndex = filtered.length ? 0 : -1;
        renderList();
        if (selectedIndex >= 0) showDetail(filtered[selectedIndex]);
        else clearDetail();
      }

      function renderList() {
        elList.innerHTML = "";
        elListHead.textContent =
          filtered.length === rawItems.length
            ? `Sonuçlar (${filtered.length})`
            : `Sonuçlar (${filtered.length} / ${rawItems.length})`;

        if (!filtered.length) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = rawItems.length ? "Eşleşme yok." : "Bu kategoride kayıt yok.";
          elList.appendChild(li);
          return;
        }

        const frag = document.createDocumentFragment();
        filtered.forEach((item, i) => {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          const title = item.h1 || item.title || "Adsız";
          btn.appendChild(document.createTextNode(title));
          if (item.url) {
            const sub = document.createElement("span");
            sub.className = "sub";
            sub.textContent = item.url;
            btn.appendChild(sub);
          }
          btn.setAttribute("aria-current", i === selectedIndex ? "true" : "false");
          btn.addEventListener("click", () => {
            selectedIndex = i;
            [...elList.querySelectorAll("button")].forEach((b, j) =>
              b.setAttribute("aria-current", j === selectedIndex ? "true" : "false")
            );
            showDetail(filtered[selectedIndex]);
          });
          li.appendChild(btn);
          frag.appendChild(li);
        });
        elList.appendChild(frag);
      }

      function clearDetail() {
        elDetail.innerHTML = '<p class="placeholder">Bir kayıt seçin.</p>';
      }

      function showDetail(item) {
        elDetail.innerHTML = "";

        const h2 = document.createElement("h2");
        h2.textContent = item.h1 || item.title || "Kayıt";
        elDetail.appendChild(h2);

        const meta = document.createElement("p");
        meta.className = "meta";
        if (item.url) {
          const a = document.createElement("a");
          a.href = item.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = item.url;
          meta.appendChild(a);
        } else {
          meta.textContent = "—";
        }
        elDetail.appendChild(meta);

        const form = document.createElement("form");
        form.className = "attr-form";
        form.setAttribute("onsubmit", "return false");

        const attrs = item.attributes;
        if (!attrs || typeof attrs !== "object") {
          const p = document.createElement("p");
          p.className = "placeholder";
          p.textContent = "Özellik verisi yok.";
          elDetail.appendChild(p);
          return;
        }

        let fieldId = 0;
        for (const [group, props] of Object.entries(attrs)) {
          if (!props || typeof props !== "object") continue;
          const fs = document.createElement("fieldset");
          const leg = document.createElement("legend");
          leg.textContent = group;
          fs.appendChild(leg);

          for (const [key, val] of Object.entries(props)) {
            const row = document.createElement("div");
            row.className = "field";
            const fid = "attr-" + fieldId++;
            const lab = document.createElement("label");
            lab.htmlFor = fid;
            lab.textContent = key;
            const text = formatValue(val);
            const long = text.length > 120 || text.includes("\n");
            let input;
            if (long) {
              input = document.createElement("textarea");
              input.readOnly = true;
              input.rows = Math.min(12, Math.max(3, Math.ceil(text.length / 80)));
            } else {
              input = document.createElement("input");
              input.type = "text";
              input.readOnly = true;
            }
            input.id = fid;
            input.value = text;
            row.appendChild(lab);
            row.appendChild(input);
            fs.appendChild(row);
          }
          form.appendChild(fs);
        }

        elDetail.appendChild(form);
      }

      async function loadManifest() {
        elStatus.textContent = "Manifest yükleniyor…";
        const res = await fetch("./manifest.json", { cache: "no-store" });
        if (!res.ok) throw new Error("manifest.json okunamadı");
        const data = await res.json();
        bundles = [];
        if (Array.isArray(data.bundles) && data.bundles.length) {
          for (const b of data.bundles) {
            const files = Array.isArray(b.files) ? b.files : [];
            if (!files.length) continue;
            bundles.push({
              label: (b.label && String(b.label).trim()) || labelForFile(files[0]),
              files,
            });
          }
        } else if (Array.isArray(data.files)) {
          const files = data.files.slice().sort((a, b) => a.localeCompare(b, "tr", { sensitivity: "base" }));
          for (const f of files) {
            bundles.push({ label: labelForFile(f), files: [f] });
          }
        }
        bundles.sort((a, b) => a.label.localeCompare(b.label, "tr", { sensitivity: "base" }));
        bundles.forEach((b, i) => {
          const opt = document.createElement("option");
          opt.value = String(i);
          opt.textContent = b.files.length > 1 ? `${b.label} (${b.files.length} parça)` : b.label;
          elDataset.appendChild(opt);
        });
        elStatus.textContent = "";
      }

      async function loadDataset(bundleIndex) {
        if (bundleIndex === "" || bundleIndex == null) {
          rawItems = [];
          filtered = [];
          elQ.value = "";
          elQ.disabled = true;
          elStatus.textContent = "";
          elListHead.textContent = "Sonuçlar";
          elList.innerHTML = "";
          clearDetail();
          return;
        }

        const bundle = bundles[Number(bundleIndex)];
        if (!bundle || !bundle.files.length) {
          rawItems = [];
          filtered = [];
          return;
        }

        elQ.disabled = true;
        elStatus.textContent = "Yükleniyor…";
        elStatus.classList.remove("error");
        clearDetail();
        elList.innerHTML = "";

        try {
          const merged = [];
          for (const filename of bundle.files) {
            const url = "./" + encodePathSegment(filename);
            const res = await fetch(url, { cache: "no-store" });
            if (!res.ok) throw new Error(filename + ": " + res.status + " " + res.statusText);
            const json = await res.json();
            const arr = Array.isArray(json.data) ? json.data : [];
            merged.push(...arr);
          }
          rawItems = merged.map((item) => {
            const copy = { ...item };
            copy._search = searchBlob(item);
            return copy;
          });
          elQ.disabled = false;
          const partNote = bundle.files.length > 1 ? ` · ${bundle.files.length} parça birleştirildi` : "";
          elStatus.textContent = `${rawItems.length} kayıt · ${bundle.label}${partNote}`;
          applyFilter();
        } catch (e) {
          rawItems = [];
          filtered = [];
          elStatus.textContent = "Yükleme hatası: " + (e && e.message ? e.message : String(e));
          elStatus.classList.add("error");
          elList.innerHTML = "";
          elListHead.textContent = "Sonuçlar";
        }
      }

      elDataset.addEventListener("change", () => {
        loadDataset(elDataset.value);
      });

      let debounce;
      elQ.addEventListener("input", () => {
        clearTimeout(debounce);
        debounce = setTimeout(applyFilter, 120);
      });

      loadManifest().catch((e) => {
        elStatus.textContent = "Manifest hatası: " + (e && e.message ? e.message : String(e));
        elStatus.classList.add("error");
      });
    })();
  </script>
</body>
</html>
