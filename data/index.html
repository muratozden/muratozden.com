<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Kütüphanesi</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --text: #1f1f22;
      --muted: #777780;
      --line: #ececef;
      --brand: #1c1c1e;
      --brand-hover: #2a2a2d;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      padding: 44px 18px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 14px;
    }

    .kicker {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      background: #ededf1;
      color: #4e4e56;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.2px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(22px, 3vw, 30px);
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      max-width: 60ch;
    }

    .panel {
      margin-top: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(15, 15, 20, 0.04);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .dataset-name {
      margin: 0 0 3px;
      font-size: 14px;
      font-weight: 600;
    }

    .dataset-meta {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }

    .download-btn {
      border: 0;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 12px;
      padding: 8px 12px;
      white-space: nowrap;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .download-btn:hover {
      background: var(--brand-hover);
      transform: translateY(-1px);
    }

    .download-btn:active {
      transform: translateY(0);
    }

    .footer-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 640px) {
      .row {
        flex-direction: column;
        align-items: flex-start;
      }

      .download-btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <span class="kicker">Data</span>
      <h1>JSON Dataset Listesi</h1>
      <p class="subtitle">
        Aşağıdaki listeden veri setlerini indirebilirsiniz. Yeni JSON dosyalarını aynı yapıda satır ekleyerek kolayca çoğaltabilirsiniz.
      </p>
    </header>

    <section class="panel" aria-label="Dataset listesi">
      <article class="row">
        <div>
          <h2 class="dataset-name">Akıllı Telefonlar Datası</h2>
          <p class="dataset-meta">Format: JSON</p>
        </div>
        <a class="download-btn" href="./akilli-telefonlar.json" download>Download</a>
      </article>
    </section>

    <p class="footer-note">Not: Dosya adlarını ve metinleri ihtiyacına göre düzenleyebilirsin.</p>
  </main>
</body>
</html>
